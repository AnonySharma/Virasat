<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6B8765" />
  <!-- Unlike the app itself (noindex — it holds personal data), the privacy
       policy is a public page: search engines and Google's OAuth consent
       screen should be able to reach it. -->
  <meta name="description" content="Virasat privacy policy — what we store, why, and the choices you have. Your family's data is yours and is never sold." />
  <title>Privacy Policy — Virasat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,30..100&family=Inter:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap" />

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />

  <!-- Early-theme guard: apply the saved light/dark choice before first paint
       so arriving from the app (or a dark-mode bookmark) doesn't flash. Same
       "virasat.theme" key + data-theme attribute the app uses. -->
  <script>
    try {
      if (localStorage.getItem("virasat.theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
</head>
<body data-legal-page="privacy">
  <main id="legal-root" class="legal-page"></main>

  <!-- Content source of truth is i18n; dom.js provides UI.legalProse +
       UI.onboardChrome; legal-page.js renders. No app.js, no cloud SDK. -->
  <script src="lib/core/i18n.js"></script>
  <script src="lib/ui/dom.js"></script>
  <script src="lib/legal-page.js"></script>
</body>
</html>
