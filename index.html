<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6B8765" />
  <!-- Family trees hold personal data about living people. There are no public
       or shareable-link trees (access is per-account via RLS), so keep the app
       out of search indexes entirely. -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Virasat — your family's living legacy. A calm, heritage-inspired workspace for preserving names, photos, and stories." />
  <title>Virasat — Your family's living legacy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,30..100&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" />

  <!-- Font Awesome 6 (free CDN). Pinned to a specific version via SRI so a
       supply-chain compromise of cdnjs can't ship malicious CSS. Hash is
       SHA-384 of font-awesome 6.5.2's all.min.css. Bump both URL + hash
       together when upgrading. Google Fonts CSS deliberately has no SRI:
       Google varies the response by user-agent (woff2 vs woff fallbacks),
       so a fixed hash would block some browsers. -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Virasat" />
  <!-- iOS ignores an SVG apple-touch-icon and falls back to a blurry page
       screenshot on the home screen. Point it at a real 180×180 PNG (opaque —
       iOS composites any alpha onto black and applies its own rounded mask). -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />

  <!-- Anti-FOUC boot guard. Boot is gated on an async Auth.ready() (app.js),
       but the app shell below is static HTML that would otherwise paint on the
       first frame — so a returning/cloud user briefly sees the bare tree-builder
       before the sign-in/landing overlay mounts on top. Hide the shell until
       app.js decides what to show and calls bootApp() (which drops .is-booting).
       Done as inline critical CSS + a class set on <html> from an inline script
       so it applies BEFORE first paint, with no dependency on external CSS load
       order. The sign-in gate, landing, and boot splash are separate overlays
       appended to <body>, so they remain visible throughout. A <noscript>-safe
       fallback isn't needed: the whole app requires JS, and if the inline script
       runs, the class is guaranteed set before paint. -->
  <style>
    html.is-booting .app-header,
    html.is-booting .app-body { visibility: hidden; }
  </style>
  <script>
    document.documentElement.classList.add("is-booting");
    // Failsafe: if app.js fails to load or throws before it can call bootApp()
    // (which clears this class), reveal the shell anyway after a few seconds so
    // a broken boot degrades to a visible (if inert) app rather than a blank
    // page. Harmless on a slow-but-healthy boot: the opaque splash/landing
    // overlay still covers the shell until boot truly completes.
    setTimeout(function () { document.documentElement.classList.remove("is-booting"); }, 8000);
  </script>
</head>
<body>

  <!-- Header (sage band) -->
  <header class="app-header">
    <button class="btn btn--ghost btn--icon hamburger-btn" id="hamburger-btn" type="button" aria-label="Open menu" data-i18n-aria-label="actions.openMenu" aria-controls="rail" aria-expanded="false">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
    <h1 class="app-title">
      <img class="app-title__icon" src="assets/icon.svg" alt="" width="36" height="36" />
      <span class="app-title__text" data-i18n="app.title">Virasat</span>
      <span class="app-title__sub" id="app-subtitle" data-i18n="app.tagline">Your family's living legacy</span>
    </h1>

    <nav class="app-nav" aria-label="Views">
      <button class="nav-btn is-active" data-view="tree" type="button">
        <i class="nav-btn__icon fa-solid fa-sitemap" aria-hidden="true"></i>
        <span class="nav-btn__label" data-i18n="nav.tree">Tree</span>
      </button>
      <button class="nav-btn" data-view="people" type="button">
        <i class="nav-btn__icon fa-solid fa-user-group" aria-hidden="true"></i>
        <span class="nav-btn__label" data-i18n="nav.people">People</span>
      </button>
      <button class="nav-btn" data-view="timeline" type="button">
        <i class="nav-btn__icon fa-solid fa-stream" aria-hidden="true"></i>
        <span class="nav-btn__label" data-i18n="nav.timeline">Timeline</span>
      </button>
      <button class="nav-btn" data-view="insights" type="button">
        <i class="nav-btn__icon fa-solid fa-chart-simple" aria-hidden="true"></i>
        <span class="nav-btn__label" data-i18n="nav.insights">Insights</span>
      </button>
    </nav>

    <label class="header-search">
      <i class="header-search__icon fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input id="header-search-input" type="search" placeholder="Search people..." data-i18n-placeholder="people.searchPlaceholder" aria-label="Search people" data-i18n-aria-label="actions.searchPeople" />
      <button id="header-search-clear" class="header-search__clear" type="button" hidden aria-label="Clear search" data-i18n-aria-label="actions.clearSearch"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </label>

    <div class="app-header__actions">
      <!-- Appearance toggles (theme + high contrast). In a signed-in cloud
           session these move into the account (avatar) menu — app.js adds
           `has-account-menu` to .app-header__actions, and CSS hides anything
           marked data-appearance-toggle. In LOCAL-ONLY mode there is no avatar,
           so they stay here as the only desktop path. The pre-login sign-in /
           first-run screens carry their own copies (UI.onboardChrome). -->
      <button class="theme-toggle btn--icon" id="theme-toggle" type="button" data-appearance-toggle aria-label="Toggle theme" title="Toggle theme" data-i18n-aria-label="actions.theme" data-i18n-title="actions.theme">
        <i class="fa-solid fa-moon theme-toggle__moon" aria-hidden="true"></i>
        <i class="fa-solid fa-sun theme-toggle__sun" aria-hidden="true"></i>
      </button>
      <!-- High contrast — an accessibility axis independent of light/dark (see
           tokens.css). Reuses the circular .theme-toggle chrome; app.js toggles
           data-contrast on <html>, persists it, and reflects aria-pressed. -->
      <button class="theme-toggle contrast-toggle btn--icon" id="contrast-toggle" type="button" data-appearance-toggle aria-pressed="false" aria-label="High contrast" title="High contrast" data-i18n-aria-label="actions.contrast" data-i18n-title="actions.contrast">
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i>
      </button>
      <div class="lang-switch" role="group" aria-label="Language" data-i18n-aria-label="actions.language">
        <button class="lang-switch__btn is-active" data-lang="en" type="button" aria-pressed="true" aria-label="English">EN</button>
        <button class="lang-switch__btn" data-lang="hi" type="button" aria-pressed="false" aria-label="हिन्दी">HI</button>
      </div>
      <!-- Undo / redo live in the tree-canvas control cluster (tree-view.js),
           not the header — they're editing actions that belong beside zoom/fit.
           app.js keeps the Cmd/Ctrl+Z / Shift+Z / Ctrl+Y shortcuts (global, all
           views) and exposes doUndo/doRedo via the virasat:undo / virasat:redo
           events the toolbar buttons dispatch. -->
      <!-- Data menu — folds Collect / Import / Export (three secondary buttons
           that used to compete with the primary Share for attention) into one
           overflow. The menu rows handle their own edit-only visibility, so
           this button shows for everyone: a viewer simply sees Export alone.
           Opened by app.js, reusing the .kebab-menu popover machinery. -->
      <button class="btn" id="data-btn" type="button" aria-haspopup="menu" aria-expanded="false" title="Data" data-i18n-title="actions.data">
        <i class="fa-solid fa-database" aria-hidden="true"></i>
        <span class="btn__label-md" data-i18n="actions.data">Data</span>
        <i class="fa-solid fa-chevron-down btn__caret" aria-hidden="true"></i>
      </button>
      <!-- Inviting family is the highest-value action in the multi-user app, so
           Share is the header's primary button. Owner-only; shown by app.js
           once cloud + ownership are known (hidden by default to avoid a flash
           in local mode or for editors/viewers). -->
      <button class="btn btn--primary" id="share-btn" type="button" title="Share" data-i18n-title="share.title" hidden>
        <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
        <span class="btn__label-md" data-i18n="share.title">Share</span>
      </button>
      <!-- Sync pip — shown by app.js only in a live cloud session. Reflects
           CloudStore.syncState() (synced / pending / offline); aria-live so a
           screen reader hears "offline — will sync" without a visual scan. -->
      <span class="sync-pip" id="sync-pip" role="status" aria-live="polite" hidden>
        <i class="sync-pip__dot fa-solid fa-circle" aria-hidden="true"></i>
        <span class="sync-pip__label" id="sync-pip-label"></span>
      </span>
    </div>

    <!-- Phone-only sync pip. The desktop pip above lives in .app-header__actions,
         which collapses to display:none ≤768px, leaving phone users (the
         flaky-connection persona) with no sync cue. This compact dot sits next
         to the kebab instead; app.js paints it from the SAME refreshSyncPip()
         off CloudStore.syncState(). The label is screen-reader-only (the dot
         carries the colour); tapping it toasts the plain-language status. -->
    <span class="sync-pip sync-pip--phone" id="sync-pip-phone" role="status" aria-live="polite" hidden>
      <i class="sync-pip__dot fa-solid fa-circle" aria-hidden="true"></i>
      <span class="sync-pip__label" id="sync-pip-phone-label"></span>
    </span>

    <!-- Phone-only Share — the desktop header Share button lives in
         .app-header__actions, which is display:none ≤768px, so on phone Share
         had no home but the kebab. Inviting family is the highest-value action
         in the multi-user app, so it earns a top-level phone slot beside the
         sync pip / kebab. Owner-of-a-live-cloud-tree only; app.js reveals BOTH
         share buttons together via refreshShareButton(). Icon-only to fit the
         phone header; aria-label names it. -->
    <button class="btn btn--primary btn--icon share-btn--phone" id="share-btn-phone" type="button"
            aria-label="Share" data-i18n-aria-label="share.title" title="Share" data-i18n-title="share.title" hidden>
      <i class="fa-solid fa-user-plus" aria-hidden="true"></i>
    </button>

    <!-- Phone-only kebab — opens an overflow menu mirroring the desktop
         action row. Hidden on >= 769px; the desktop row handles those. -->
    <button class="btn btn--ghost btn--icon kebab-btn" id="kebab-btn" type="button"
            aria-label="More actions" data-i18n-aria-label="actions.moreActions" aria-haspopup="menu" aria-expanded="false">
      <i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>
    </button>
  </header>

  <!-- 3-pane body -->
  <div class="app-body">

    <!-- Left rail: filters / tools / stats / legacy CTA -->
    <aside class="app-rail" id="rail">
      <!-- View switcher. On desktop this duplicates the header tabs (.app-nav),
           so it's hidden ≥769px via .rail-block--views. It stays visible in the
           phone slide-in drawer, where .app-nav is display:none and this is the
           ONLY way to switch views. -->
      <section class="rail-block rail-block--views">
        <h3 class="rail-heading" data-i18n="rail.overview">Overview</h3>
        <ul class="rail-list" id="rail-views">
          <li><button class="rail-item is-active" data-view="tree" type="button"><i class="fa-solid fa-sitemap"></i><span data-i18n="nav.tree">Tree</span></button></li>
          <li><button class="rail-item" data-view="people" type="button"><i class="fa-solid fa-user-group"></i><span data-i18n="nav.people">People</span></button></li>
          <li><button class="rail-item" data-view="timeline" type="button"><i class="fa-solid fa-stream"></i><span data-i18n="nav.timeline">Timeline</span></button></li>
          <li><button class="rail-item" data-view="insights" type="button"><i class="fa-solid fa-chart-simple"></i><span data-i18n="nav.insights">Insights</span></button></li>
        </ul>
      </section>

      <!-- Multi-tree home. Hidden until cloud mode is confirmed active
           (app.js reveals it) so the single-device build shows no dead entry. -->
      <section class="rail-block" id="rail-trees-block" hidden>
        <ul class="rail-list">
          <li><button class="rail-item" id="tool-trees" type="button"><i class="fa-solid fa-folder-tree"></i><span data-i18n="tree.yourTrees">Your trees</span></button></li>
        </ul>
      </section>

      <!-- Faceted filter panel. Built entirely by app.js renderFilterPanel():
           Status / Gender / Era / Birthplace / Occupation / Needs attention,
           each group rendered only when it carries options, with live
           in-context counts. The single home for narrowing the family — the
           People grid hides non-matches, Tree & Timeline dim them. -->
      <!-- "You" — a per-viewer personal lens (local-only, never synced). Pick
           yourself and the tree marks you with a gold ring while every relative
           shows their kin term to you. Available to viewers too (it edits no
           tree data), so it sits above the edit-gated Tools. Populated by
           app.js (renderSelfPicker) with a HeritageSelect person picker. -->
      <section class="rail-block" id="rail-you-block">
        <div class="rail-you-head">
          <h3 class="rail-heading" data-i18n="rail.you">You</h3>
          <!-- Info affordance: hover shows the hint (native title, never clipped
               by the rail's overflow); tap toasts it on touch where title can't. -->
          <button type="button" class="rail-you-info" id="rail-you-info"
                  data-i18n-title="rail.youHint" data-i18n-aria-label="rail.youHint">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
          </button>
        </div>
        <div id="rail-you-panel" class="rail-you-panel"></div>
      </section>

      <section class="rail-block">
        <h3 class="rail-heading" data-i18n="rail.filter">Filter</h3>
        <div id="rail-filter-panel" class="rail-filter-panel"></div>
      </section>

      <section class="rail-block">
        <h3 class="rail-heading" data-i18n="rail.tools">Tools</h3>
        <ul class="rail-list">
          <li class="js-edit-only"><button class="rail-item" id="tool-add" type="button"><i class="fa-solid fa-user-plus"></i><span data-i18n="rail.addPerson">Add Person</span></button></li>
          <li><button class="rail-item" id="tool-edit" type="button"><i class="fa-regular fa-pen-to-square"></i><span data-i18n="rail.editTree">Manage people</span></button></li>
          <li><button class="rail-item" id="tool-path" type="button"><i class="fa-solid fa-route"></i><span data-i18n="rail.findRelation">Find relation</span></button></li>
          <li><button class="rail-item" id="tool-print" type="button"><i class="fa-solid fa-print"></i><span data-i18n="rail.printBook">Print family book</span></button></li>
          <!-- "How this app works" moved to the header menu (person/avatar icon
               → Help), where it opens the standalone help.html page in a new
               tab. -->
          <li><button class="rail-item" id="tool-about" type="button"><i class="fa-solid fa-seedling"></i><span data-i18n="actions.about">About Virasat</span></button></li>
          <!-- Rare, high-consequence actions split below a divider so the
               everyday tools read first and Reset isn't one slip from Add.
               Both rows are edit-only, so the divider is too (else a viewer
               sees a divider with nothing under it). Both REPLACE/WIPE the whole
               tree, so app.js (refreshDestructiveTools) further hides them for a
               non-owner on a shared cloud tree — an editor edits people, not the
               whole blob. The divider carries an id so it can hide with them. -->
          <li class="rail-divider js-edit-only" id="tools-danger-divider" aria-hidden="true"></li>
          <li class="js-edit-only"><button class="rail-item" id="tool-sample" type="button"><i class="fa-solid fa-wand-magic-sparkles"></i><span data-i18n="rail.trySample">Try sample family</span></button></li>
          <li class="js-edit-only"><button class="rail-item rail-item--danger" id="tool-reset" type="button"><i class="fa-solid fa-trash-can"></i><span data-i18n="rail.reset">Reset everything</span></button></li>
        </ul>
      </section>

      <!-- The Tree-view subtitle ("15 members · 4 generations · 12 memories")
           already carries these numbers prominently, so the rail keeps just a
           single quiet reference line rather than two competing number tiles.
           IDs preserved so app.js refreshRail() still populates them. -->
      <section class="rail-block">
        <p class="rail-statline">
          <span id="stat-members">0</span> <span data-i18n="rail.members">Members</span>
          <span class="rail-statline__sep" aria-hidden="true">·</span>
          <span id="stat-generations">0</span> <span data-i18n="rail.generations">Generations</span>
        </p>
      </section>

      <section class="rail-cta">
        <div class="rail-cta__title" data-i18n="rail.legacyTitle">Preserve your legacy</div>
        <p class="rail-cta__body" id="cta-body" data-i18n="rail.legacyBody">Names, photos, and stories — saved on your device.</p>
        <button class="btn btn--primary btn--block" id="cta-export" type="button" data-i18n="rail.legacyCta">Get started</button>
      </section>
    </aside>

    <!-- Center main canvas -->
    <main class="app-main">
      <section class="view view--tree is-active" id="view-tree" aria-label="Family tree"></section>
      <section class="view view--people" id="view-people" aria-label="People"></section>
      <section class="view view--timeline" id="view-timeline" aria-label="Timeline"></section>
      <section class="view view--insights" id="view-insights" aria-label="Insights"></section>
    </main>

    <!-- Right inspector -->
    <aside class="app-inspector" id="inspector">
      <button class="inspector-close" id="inspector-close" type="button" aria-label="Close details" data-i18n-aria-label="actions.closeDetails">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <div class="inspector-empty" id="inspector-empty">
        <div class="inspector-empty__icon"><i class="fa-solid fa-hand-pointer"></i></div>
        <div class="inspector-empty__title" data-i18n="inspector.emptyTitle">Select a person</div>
        <div class="inspector-empty__text" data-i18n="inspector.emptyText">Click anyone in the tree, list, or timeline to see their details here.</div>
      </div>
      <div class="inspector-content" id="inspector-content" hidden></div>
    </aside>

  </div>

  <div class="app-overlay" id="app-overlay"></div>
  <div class="modal-root" id="modal-root" aria-hidden="true"></div>
  <input type="file" id="import-file-input" accept="application/json,text/csv,.csv,.json" hidden />
  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="true"></div>

  <!-- core: state + storage + i18n. Everything else depends on these. -->
  <script src="lib/core/i18n.js"></script>
  <script src="lib/core/data-store.js"></script>
  <script src="lib/core/photo-store.js"></script>

  <!-- ui primitives -->
  <script src="lib/ui/dom.js"></script>

  <!-- resolvers over the data store, consumed by components + views below -->
  <script src="lib/features/kin-terms.js"></script>
  <script src="lib/features/self-anchor.js"></script>

  <!-- shared components -->
  <script src="lib/components/heritage-datepicker.js"></script>
  <script src="lib/components/heritage-select.js"></script>
  <script src="lib/components/crop-editor.js"></script>
  <script src="lib/components/path-finder.js"></script>
  <script src="lib/components/inspector.js"></script>

  <!-- views -->
  <script src="lib/views/people-view.js"></script>
  <script src="lib/views/tree-view.js"></script>
  <script src="lib/views/timeline-view.js"></script>
  <script src="lib/views/insights-view.js"></script>

  <!-- features -->
  <script src="lib/features/image-export.js"></script>
  <script src="lib/features/export-import.js"></script>
  <script src="lib/features/collect-form.js"></script>
  <script src="lib/features/print-book.js"></script>
  <script src="lib/features/anniversaries.js"></script>

  <!-- cloud auth: gated on lib/auth/config.js. This build ships real
       credentials, so the Supabase SDK is loaded lazily by auth-store.js and
       the sign-in gate appears. Blank the config to make these inert again —
       no SDK is fetched and the app boots as the offline single-device PWA. -->
  <script src="lib/auth/config.js"></script>
  <script src="lib/auth/auth-store.js"></script>
  <script src="lib/auth/cloud-store.js"></script>
  <script src="lib/auth/sign-in.js"></script>
  <script src="lib/auth/first-run.js"></script>
  <script src="lib/auth/tree-list.js"></script>
  <script src="lib/auth/sharing.js"></script>

  <!-- sample data: bundled "Try sample family" tree. Lives in tests/ to
       keep lib/ free of base64 photo blobs. Loaded eagerly so the
       welcome offer + rail tool can call SampleData.build() sync. -->
  <script src="tests/sample-data.js"></script>

  <!-- entry -->
  <script src="lib/app.js"></script>

  <!-- The temporary Hindi (Devanagari) font lab (lib/dev/hindi-font-lab.js) is
       kept in the repo but NOT loaded: we settled on Noto Sans Devanagari
       (tokens.css --font-hi). To evaluate candidate faces again, re-add:
       <script src="lib/dev/hindi-font-lab.js"></script> and open with ?fontlab. -->
</body>
</html>
